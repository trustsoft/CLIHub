name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check development version
        shell: pwsh
        run: ./.github/scripts/Check-DevVersion.ps1

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build
        # -warnaserror turns the zero-warning Release baseline into a gate: any compiler or analyzer
        # warning fails the run. When a new SDK introduces an untriaged analyzer code, exclude that code
        # explicitly (-warnaserror-:CSXXXX or -warnaserror-:IDExxxx) instead of dropping the flag.
        run: dotnet build CLIHub.sln -c Release -warnaserror

      # One step per test project: GitHub's pwsh shell only fails a step on the block's last command
      # ($PSNativeCommandUseErrorActionPreference is not set), so a shared block would report a green
      # step when an earlier project's tests fail.
      - name: Test CLIHub.Core.Tests
        shell: pwsh
        run: dotnet test tests/CLIHub.Core.Tests/CLIHub.Core.Tests.csproj -c Release --no-build --collect:"XPlat Code Coverage" --results-directory artifacts/coverage/Core.Tests

      - name: Test CLIHub.Core.Windows.Tests
        shell: pwsh
        run: dotnet test tests/CLIHub.Core.Windows.Tests/CLIHub.Core.Windows.Tests.csproj -c Release --no-build --collect:"XPlat Code Coverage" --results-directory artifacts/coverage/Core.Windows.Tests

      - name: Test CLIHub.Tests
        shell: pwsh
        run: dotnet test tests/CLIHub.Tests/CLIHub.Tests.csproj -c Release --no-build --collect:"XPlat Code Coverage" --results-directory artifacts/coverage/CLIHub.Tests

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-results
          path: artifacts/coverage/**/*.cobertura.xml
          if-no-files-found: ignore
