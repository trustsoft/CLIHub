schema: spec-driven

context: |
  Language: en
  All artifacts must be written in en.

  CLIHub — Windows-компаньон для запуска и обновления AI Agents CLI в папке
  проекта в один клик (system-tray + hotkey-попап, runtime ps/cmd/wt),
  с реестром проектов и динамическим списком агентов через плагины.

  Полное видение: docs/vision.md
  Состав и поведение UI: docs/ui.md

