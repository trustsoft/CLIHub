<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CLIHub banner</title>
<style>
  :root {
    --bg: #0b0c0e;
    --fg: #f5f7fa;
    --muted: #98a2b3;
    --accent: #4cc2ff;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    width: 1280px;
    height: 360px;
    overflow: hidden;
    background: var(--bg);
    color: var(--fg);
    font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
  }

  body { position: relative; }

  .glow-a,
  .glow-b {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
  }

  .glow-a {
    left: -140px;
    top: -220px;
    width: 760px;
    height: 760px;
    background: radial-gradient(circle, rgba(76, 194, 255, 0.22), rgba(76, 194, 255, 0) 64%);
  }

  .glow-b {
    right: -180px;
    bottom: -300px;
    width: 860px;
    height: 860px;
    background: radial-gradient(circle, rgba(124, 109, 255, 0.20), rgba(124, 109, 255, 0) 64%);
  }

  .grid {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
    background-size: 32px 32px;
    -webkit-mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.85), rgba(0, 0, 0, 0.18));
    mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.85), rgba(0, 0, 0, 0.18));
  }

  .edge {
    position: absolute;
    inset: 0;
    border: 1px solid rgba(255, 255, 255, 0.08);
    pointer-events: none;
  }

  .content {
    position: relative;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 64px;
  }

  .identity {
    display: flex;
    align-items: center;
    gap: 26px;
  }

  .icon-wrap {
    position: relative;
    width: 96px;
    height: 96px;
    flex: none;
  }

  .icon-wrap::after {
    content: "";
    position: absolute;
    inset: -18px;
    border-radius: 40px;
    background: radial-gradient(circle, rgba(76, 194, 255, 0.25), rgba(76, 194, 255, 0) 70%);
    z-index: -1;
  }

  .icon {
    width: 96px;
    height: 96px;
    display: block;
    border-radius: 24px;
    box-shadow:
      0 18px 50px rgba(31, 111, 181, 0.45),
      0 0 0 1px rgba(255, 255, 255, 0.10) inset;
  }

  .title {
    margin: 0;
    font-size: 62px;
    line-height: 1;
    font-weight: 650;
    letter-spacing: -1.8px;
  }

  .tagline {
    margin: 9px 0 0;
    font-size: 20px;
    line-height: 1.3;
    color: rgba(255, 255, 255, 0.78);
    letter-spacing: -0.1px;
  }

  .meta {
    display: flex;
    gap: 8px;
    margin-top: 14px;
  }

  .pill {
    padding: 5px 10px;
    border: 1px solid rgba(255, 255, 255, 0.10);
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.035);
    color: var(--muted);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.7px;
    text-transform: uppercase;
  }

  .hotkey {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    padding-right: 12px;
  }

  .hotkey-label {
    color: var(--muted);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 2.2px;
    text-transform: uppercase;
  }

  .keys {
    display: flex;
    align-items: center;
  }

  .key {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 72px;
    min-width: 72px;
    padding: 0 20px;
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 14px;
    background: linear-gradient(180deg, #2b2f36, #1a1d22);
    box-shadow:
      0 6px 0 rgba(0, 0, 0, 0.45),
      inset 0 1px 0 rgba(255, 255, 255, 0.14),
      0 14px 34px rgba(0, 0, 0, 0.35);
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 0.2px;
  }

  .key.accent {
    border-color: rgba(130, 208, 255, 0.65);
    background: linear-gradient(180deg, #3e9ade, #1f6fb5);
    box-shadow:
      0 6px 0 #0d3c60,
      inset 0 1px 0 rgba(255, 255, 255, 0.35),
      0 0 38px rgba(76, 194, 255, 0.45),
      0 14px 34px rgba(0, 0, 0, 0.35);
  }

  .plus {
    margin: 0 12px;
    color: #667085;
    font-size: 20px;
    font-weight: 400;
  }

  .hotkey-note {
    color: var(--muted);
    font-size: 13px;
  }
</style>
</head>
<body>
  <div class="glow-a"></div>
  <div class="glow-b"></div>
  <div class="grid"></div>
  <div class="edge"></div>

  <div class="content">
    <div class="identity">
      <div class="icon-wrap">
        <img class="icon" src="../../../assets/appIcon/GLM5.3F/icon_256.png" alt="CLIHub">
      </div>
      <div>
        <h1 class="title">CLIHub</h1>
        <p class="tagline">Launch AI coding agents in the right project folder.</p>
        <div class="meta">
          <span class="pill">Windows 10 / 11</span>
          <span class="pill">.NET 10</span>
          <span class="pill">JSON plugins</span>
        </div>
      </div>
    </div>

    <div class="hotkey">
      <div class="hotkey-label">Global hotkey</div>
      <div class="keys">
        <div class="key">Ctrl</div>
        <div class="plus">+</div>
        <div class="key">Shift</div>
        <div class="plus">+</div>
        <div class="key accent">Space</div>
      </div>
      <div class="hotkey-note">Opens from any app, right where you work.</div>
    </div>
  </div>
</body>
</html>
