version: 1
# ─────────────────────────────────────────────────────────────────────────────
# CLIHub subagent model policy
#
# TWO LAYERS:
#   1. THIS file (docs/agent-model-policy.yaml) — versioned, human-curated:
#      roles, model catalog, presets, time-windowed overrides.
#   2. .opencode/model-policy.json — gitignored runtime selection, written by the
#      orchestrator (observations: exhausted_until, session log) and the sidebar
#      (user intent: active_preset, role overrides).
#
# RESOLUTION AT DISPATCH (orchestrator):
#   effective_preset = first override with valid_from <= now < valid_until, else active_preset
#   for a role: take the preset's ordered model list, drop models whose exhausted_until
#   (runtime file) is still in the future, then try in order:
#     - availability failure (429 / quota / billing window / auth / model-not-found)
#         -> write exhausted_until = now + backoff into the runtime file, try next model
#     - quality failure (the agent misunderstood the task)
#         -> escalate to the next model in the same list
#   if the role's on_exhaustion is block_and_ask and no acceptable model remains
#     -> STOP the pipeline and ask the user (never silently weaken planner/verifier)
#
# MERGE RULE for the runtime file: the orchestrator owns `exhausted_until` and
# `session_log`; the sidebar owns `active_preset` and `role_overrides`. Each writer
# read-modify-writes only its own fields.
# ─────────────────────────────────────────────────────────────────────────────

active_preset: default

# Roles (task groups). tier = minimum model capability; on_exhaustion = what happens
# when every model in the role's chain is unavailable.
roles:
  planner:      { agents: [pipe/planner],      tier: high, on_exhaustion: block_and_ask }
  implementer:  { agents: [pipe/implementer],  tier: high, on_exhaustion: next }
  verifier:     { agents: [pipe/verifier],     tier: high, on_exhaustion: block_and_ask }
  explorer:     { agents: [explore],           tier: any,  on_exhaustion: next }
  mechanical:   { agents: [general],           tier: any,  on_exhaustion: next }

# Model catalog.
#   billing: plan  = subscription with shared limits (Z.AI 5-hour + weekly)
#            paid  = pay-per-token (relay.fast / deepseek), no subscription limit
#            free  = quota-limited free model
# Free-model rule: a model is free when its NAME contains "free"/"Free" (usually a
# suffix), or it is opencode/big-pickle. The full relay.fast catalogue is larger than
# what is listed here; add entries when a chain needs one.
# max_concurrent is a conservative guess to avoid parallel-dispatch 429s; tune empirically.
models:
  # ── subscription (Z.AI plan) ────────────────────────────────────────────────
  zai-coding-plan/glm-5.3:
    billing: plan
    tier: high
    limits: "5-hour + weekly"
    max_concurrent: 4
  zai-coding-plan/glm-5.3-flash:
    billing: plan
    tier: medium
    limits: "shares the Z.AI plan"
    max_concurrent: 8

  # ── pay-per-token (relay.fast / deepseek) ───────────────────────────────────
  relayfast/claude-sonnet-5:      { billing: paid, tier: high }
  relayfast/gpt-5.6-sol:          { billing: paid, tier: high }
  relayfast/deepseek-v4-pro:      { billing: paid, tier: high }
  relayfast/kimi-k2.7-code:       { billing: paid, tier: high }
  relayfast/claude-haiku-4-5:     { billing: paid, tier: medium }
  relayfast/deepseek-v4.1-flash:  { billing: paid, tier: medium }
  deepseek/deepseek-v4-pro:      { billing: paid, tier: high }
  deepseek/deepseek-flash:       { billing: paid, tier: medium }

  # ── free (quota-limited) ────────────────────────────────────────────────────
  opencode/glm-5.3-flash-free:       { billing: free, tier: medium }
  opencode/deepseek-v4.1-flash-free: { billing: free, tier: medium }
  opencode/minimax-m3.1-flash-free:  { billing: free, tier: low }
  opencode/mimo-v2.6-flash-free:      { billing: free, tier: low }
  opencode/big-pickle:               { billing: free, tier: low }
  opencode/longcat-2.5-preview-free: { billing: free, tier: low }
  opencode/beam-free:                { billing: free, tier: low }
  opencode/nemotron-3.5-super-vl-free: { billing: free, tier: low }

# Presets: named complete configurations. Ordered lists = fallback chains.
presets:
  default:
    planner:      [zai-coding-plan/glm-5.3, relayfast/claude-sonnet-5, relayfast/deepseek-v4-pro]
    implementer:  [zai-coding-plan/glm-5.3, relayfast/claude-sonnet-5, relayfast/deepseek-v4-pro, zai-coding-plan/glm-5.3-flash]
    verifier:     [zai-coding-plan/glm-5.3, relayfast/claude-sonnet-5, relayfast/deepseek-v4-pro]
    explorer:     [zai-coding-plan/glm-5.3-flash, opencode/glm-5.3-flash-free, opencode/deepseek-v4.1-flash-free]
    mechanical:   [zai-coding-plan/glm-5.3-flash, opencode/glm-5.3-flash-free]

  # Z.AI plan limits (5-hour or weekly) exhausted — quality roles move to pay-per-token.
  plan_exhausted:
    planner:      [relayfast/claude-sonnet-5, relayfast/deepseek-v4-pro, deepseek/deepseek-v4-pro]
    implementer:  [relayfast/claude-sonnet-5, relayfast/deepseek-v4-pro, deepseek/deepseek-v4-pro, relayfast/deepseek-v4.1-flash]
    verifier:     [relayfast/claude-sonnet-5, relayfast/deepseek-v4-pro, deepseek/deepseek-v4-pro]
    explorer:     [opencode/glm-5.3-flash-free, opencode/deepseek-v4.1-flash-free, opencode/minimax-m3.1-flash-free]
    mechanical:   [opencode/glm-5.3-flash-free, opencode/deepseek-v4.1-flash-free]

  # No paid budget: free everywhere. Quality roles hit block_and_ask quickly, which is
  # the intended safety, not a failure.
  free_only:
    planner:      [opencode/glm-5.3-flash-free, opencode/deepseek-v4.1-flash-free]
    implementer:  [opencode/glm-5.3-flash-free, opencode/deepseek-v4.1-flash-free, opencode/minimax-m3.1-flash-free]
    verifier:     [opencode/glm-5.3-flash-free, opencode/deepseek-v4.1-flash-free]
    explorer:     [opencode/glm-5.3-flash-free, opencode/deepseek-v4.1-flash-free, opencode/minimax-m3.1-flash-free]
    mechanical:   [opencode/glm-5.3-flash-free, opencode/mimo-v2.6-flash-free]

  # Cheap/fast everywhere quality allows.
  flash_only:
    planner:      [zai-coding-plan/glm-5.3-flash, relayfast/deepseek-v4.1-flash]
    implementer:  [zai-coding-plan/glm-5.3-flash, relayfast/deepseek-v4.1-flash]
    verifier:     [zai-coding-plan/glm-5.3-flash, relayfast/deepseek-v4.1-flash]
    explorer:     [zai-coding-plan/glm-5.3-flash, opencode/glm-5.3-flash-free]
    mechanical:   [zai-coding-plan/glm-5.3-flash, opencode/glm-5.3-flash-free]

# Time-windowed overrides: "until <valid_until>, use this preset".
# The first entry whose window contains now wins; empty list = always active_preset.
overrides: []
